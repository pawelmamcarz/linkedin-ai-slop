<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zgłoś pomyłkę — LinkedIn AI Slop</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Zgłoś pomyłkę</h1><p>Pomóż poprawić ocenę treści. Formularz nie dołącza posta automatycznie.</p>
<form id="feedback">
<label>Ocena <select id="badge"><option value="concrete">Konkretny</option><option value="low_information">Mało treściwy</option><option value="uncertain">Niepewna ocena</option></select></label>
<label>Dlaczego się nie zgadzasz? <textarea id="reason" required maxlength="1000" rows="4"></textarea></label>
<label>Fragment posta (opcjonalnie) <textarea id="excerpt" maxlength="6000" rows="5"></textarea></label>
<p>Wyślesz wybraną ocenę, uzasadnienie i tylko samodzielnie wklejony fragment. Zgłoszenie będzie dostępne operatorowi pilotażu przez maksymalnie 30 dni. Nie wklejaj danych poufnych.</p>
<button type="submit">Wyślij zgłoszenie</button><p id="status" role="status" aria-live="polite"></p>
</form><script src="ext-api.js"></script><script src="feedback.js"></script></main></body></html>
