<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn AI Slop</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>LinkedIn AI Slop</h1>
      <p class="lede">
        Odznaki na Twoim feedzie. Tekst idzie do proxy, a stamtąd do Jev
        (<code>jev-latest</code>). Klucz API nie trafia do rozszerzenia.
      </p>
      <form id="settings">
        <label class="check">
          <input id="enabled" type="checkbox" />
          Oceniaj posty podczas scrollowania
        </label>
        <label class="check">
          <input id="blur-slop" type="checkbox" checked />
          Rozmywaj posty AI slop
        </label>
        <span class="hint">Blur AI Slop posts. Domyślnie włączone. Rozmywa całą kartę z werdyktem AI slop. Odznaka zostaje czytelna, a „Pokaż” odsłania jeden post.</span>
        <label>
          Próg AI slop
          <span id="threshold-value">0.65</span>
          <input id="threshold" type="range" min="0.15" max="0.95" step="0.05" />
          <span class="hint">Model ocenia każdy post liczbą od 0 do 1. Odznaka „AI slop” pojawia się, gdy ta liczba osiąga próg albo go przekracza. Próg 0.15 jest niski i czuły, więc odznakę dostaje więcej postów. Próg 0.95 jest wysoki i ostry, więc odznakę dostaje mniej postów, a częściej widać „Ludzki” albo „Mieszany”.</span>
        </label>
        <fieldset class="modes">
          <legend>Tryb</legend>
          <label class="check">
            <input type="radio" name="mode" value="demo" />
            Demo: publiczne proxy, twarde limity
          </label>
          <label class="check">
            <input type="radio" name="mode" value="byok" />
            BYOK: własne proxy i własny klucz na serwerze
          </label>
          <label class="check">
            <input type="radio" name="mode" value="pro" />
            Pro: token i wyższe limity na hostowanym proxy
          </label>
        </fieldset>
        <label>
          Adres proxy
          <input id="proxy" type="url" required spellcheck="false" />
          <span class="hint">Demo i Pro używają <code>https://proxy-production-ebcc.up.railway.app</code>. BYOK: własny adres, także localhost. Host spoza manifestu wymaga zgody przeglądarki.</span>
        </label>
        <label id="token-row">
          Token Pro
          <input id="pro-token" type="password" spellcheck="false" autocomplete="off" />
          <span class="hint">To nie jest <code>TYPESAFE_API_KEY</code>. Klucz TypeSafe zostaje na proxy. Token trzymamy w storage rozszerzenia (sync, a gdy sync nie działa, local).</span>
        </label>
        <div class="actions">
          <button type="submit">Zapisz</button>
          <button type="button" id="check" class="secondary">Sprawdź proxy</button>
        </div>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script src="ext-api.js"></script>
    <script src="options.js"></script>
  </body>
</html>
